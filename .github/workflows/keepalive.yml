name: Supabase keepalive

# The free Supabase plan pauses a project after about a week without API
# traffic, and a paused project takes the tool's login down with it. Two
# tiny read requests a week keep it awake. Needs the repository secrets
# SUPABASE_URL and SUPABASE_ANON_KEY (the same values the app ships to the
# browser).

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set" >&2
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/runs?select=id&limit=1")
          echo "PostgREST answered $code"
          # 200 with rows, or 200 with an empty array under RLS: both count as traffic.
          [ "$code" = "200" ]
